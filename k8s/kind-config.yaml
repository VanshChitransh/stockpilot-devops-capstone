# local cluster for the demo: a single node keeps the whole stack (app + prometheus + grafana)
# inside a laptop's docker memory budget. host ports 80/443 go to the ingress controller.
# add `- role: worker` entries for a multi-node cluster if you have RAM to spare
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stockpilot
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
      - {containerPort: 443, hostPort: 443, protocol: TCP}
