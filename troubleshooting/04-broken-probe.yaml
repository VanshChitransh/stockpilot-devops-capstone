# SYMPTOM: pod is Running but READY shows 0/1 forever, and it never gets traffic
# CAUSE:   readinessProbe hits /readyz, the app serves /ready -> every probe gets a 404
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-probe
  namespace: stockpilot
spec:
  replicas: 1
  selector:
    matchLabels: {lab: broken-probe}
  template:
    metadata:
      labels: {lab: broken-probe}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: stockpilot-backend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: stockpilot-db, key: DATABASE_URL}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
