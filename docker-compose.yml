name: stockpilot


services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
    # no host port on purpose: only backend talks to the db, over the compose network.
    # inspect it with: docker compose exec postgres psql -U stockpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@postgres:5432/stockpilot
    depends_on:
      postgres:
        condition: service_healthy   # don't run migrations before postgres accepts connections
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
